name: iac-sentinel review

# Run on every pull request: generate the plan, then let iac-sentinel review it.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# The job token needs models:read (call GitHub Models / the LLM) and
# pull-requests:write (post the review comment).
permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Generate plan.json. Mock credentials + skip flags in main.tf let this run
      # fully offline, so CI needs no real cloud account. This is the caller's job:
      # iac-sentinel reviews the plan, it never generates it (see the action's ADR-008).
      - name: Generate terraform plan JSON
        run: |
          terraform init -input=false
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > plan.json

      # Hand the generated plan to the published action.
      - uses: onurglr/iac-sentinel@v1
        with:
          plan-path: plan.json
